<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniInfra AI | Authentication & Console Access</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, #1e1b4b 0%, #05070d 80%);
            overflow-x: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            position: relative;
        }
        .login-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.75rem;
            border-radius: 20px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.2);
            animation: fadeIn 0.6s ease-out;
            position: relative;
            z-index: 10;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .brand-link {
            text-decoration: none;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.35rem;
            font-weight: 800;
        }
        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6366f1 0%, #38bdf8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }
        .badge-ai {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 12px;
            background: rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.4);
        }
        h2 { 
            text-align: center; 
            margin-bottom: 1.5rem; 
            color: #fff; 
            font-weight: 700; 
            font-size: 1.35rem;
            letter-spacing: -0.01em; 
        }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { 
            display: block; 
            color: #94a3b8; 
            font-size: 0.82rem; 
            margin-bottom: 0.45rem; 
            font-weight: 500;
        }
        .form-group input { 
            width: 100%; 
            background: rgba(0,0,0,0.35); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #fff; 
            padding: 0.8rem 1rem; 
            border-radius: 8px; 
            outline: none;
            font-size: 0.9rem;
            transition: all 0.25s;
        }
        .form-group input:focus { 
            border-color: #6366f1; 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); 
        }
        .btn-primary { 
            width: 100%; 
            padding: 0.9rem; 
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); 
            border: none; 
            border-radius: 8px; 
            color: #fff; 
            font-weight: 600; 
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
            transition: all 0.25s;
            margin-top: 0.5rem;
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }
        .toggle-link { 
            text-align: center; 
            margin-top: 1.5rem; 
            color: #94a3b8; 
            font-size: 0.85rem; 
        }
        .toggle-link a { 
            color: #38bdf8; 
            text-decoration: none; 
            font-weight: 600; 
            cursor: pointer; 
            margin-left: 0.3rem;
        }
        .toggle-link a:hover { text-decoration: underline; }
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #94a3b8;
            font-size: 0.82rem;
            text-decoration: none;
            margin-bottom: 1.25rem;
            transition: color 0.2s;
        }
        .back-home:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="login-card">
        <a href="/" class="back-home"><i class="fas fa-arrow-left"></i> Back to Homepage</a>

        <div class="brand-header">
            <a href="/" class="brand-link">
                <div class="brand-icon"><i class="fas fa-cubes"></i></div>
                <span>OmniInfra</span>
                <span class="badge-ai">AI</span>
            </a>
        </div>

        <h2 id="form-title">Console Login</h2>
        <div id="error-msg" style="color: #f87171; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.6rem 0.8rem; border-radius: 6px; font-size: 0.82rem; margin-bottom: 1rem; display: none; text-align: center;"></div>
        
        <form id="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="shubham554">
            </div>
            <div class="form-group" id="email-group" style="display: none;">
                <label>Email (Optional)</label>
                <input type="email" id="email" placeholder="shubham@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">Login to Console</button>
        </form>

        <div class="toggle-link">
            <span id="toggle-text">Don't have an account?</span> 
            <a onclick="toggleAuthMode()" id="toggle-btn">Sign Up</a>
        </div>
    </div>

    <script>
        let isLogin = true;

        // Auto-switch to register if URL has #register
        if (window.location.hash === '#register' || window.location.search.includes('mode=register')) {
            isLogin = false;
            updateFormUI();
        }

        function toggleAuthMode() {
            isLogin = !isLogin;
            updateFormUI();
        }

        function updateFormUI() {
            document.getElementById('form-title').innerText = isLogin ? 'Console Login' : 'Create Free Account';
            document.getElementById('submit-btn').innerText = isLogin ? 'Login to Console' : 'Create Account & Launch';
            document.getElementById('toggle-text').innerText = isLogin ? "Don't have an account?" : "Already have an account?";
            document.getElementById('toggle-btn').innerText = isLogin ? 'Sign Up' : 'Login';
            document.getElementById('email-group').style.display = isLogin ? 'none' : 'block';
            document.getElementById('error-msg').style.display = 'none';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            const errorElem = document.getElementById('error-msg');
            const submitBtn = document.getElementById('submit-btn');

            const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
            const body = isLogin ? { username, password } : { username, password, email };

            submitBtn.disabled = true;
            submitBtn.innerText = isLogin ? 'Authenticating...' : 'Creating Account...';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = '/app';
                } else {
                    errorElem.innerText = data.detail || data.error || "Authentication failed. Please verify credentials.";
                    errorElem.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerText = isLogin ? 'Login to Console' : 'Create Account & Launch';
                }
            } catch (err) {
                errorElem.innerText = "Connection error to platform API";
                errorElem.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = isLogin ? 'Login to Console' : 'Create Account & Launch';
            }
        });
    </script>
</body>
</html>

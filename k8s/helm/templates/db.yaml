apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-ai-db
  labels:
    app.kubernetes.io/name: terraform-ai-db
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terraform-ai-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terraform-ai-db
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.database.image | default "postgres:15-alpine" }}"
          imagePullPolicy: {{ .Values.database.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.user | default "terra_user" | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.database.password | default "terra_password" | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | default "terraform_agent" | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terraform-ai-db
  labels:
    app.kubernetes.io/name: terraform-ai-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: terraform-ai-db

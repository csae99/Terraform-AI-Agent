{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "terraform-ai-agent.fullname" . }}-prometheus-config
  labels:
    {{- include "terraform-ai-agent.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'terraform-ai-dashboard'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['{{ include "terraform-ai-agent.fullname" . }}-dashboard:5000']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terraform-ai-agent.fullname" . }}-prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          ports:
            - containerPort: 9090
              name: web
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "terraform-ai-agent.fullname" . }}-prometheus
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terraform-ai-agent.fullname" . }}-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.2
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "terraform-ai-agent.fullname" . }}-grafana
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
{{- end }}

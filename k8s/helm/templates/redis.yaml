apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-ai-redis
  labels:
    app.kubernetes.io/name: terraform-ai-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terraform-ai-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terraform-ai-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image | default "redis:7-alpine" }}"
          imagePullPolicy: {{ .Values.redis.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terraform-ai-redis
  labels:
    app.kubernetes.io/name: terraform-ai-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: terraform-ai-redis

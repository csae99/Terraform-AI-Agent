# Default values for terraform-ai-operator Helm chart.

replicaCount: 1

image:
  repository: ghcr.io/terraform-ai/operator
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

operator:
  logLevel: INFO
  defaultEngine: opentofu
  reconcileIntervalSec: 300
  driftCheckEnabled: true
  gitopsProvider: argocd

serviceAccount:
  create: true
  annotations: {}
  name: "terraform-ai-operator"

rbac:
  create: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

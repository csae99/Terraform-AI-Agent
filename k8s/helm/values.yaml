# Default values for terraform-ai Helm chart.

replicaCount: 1

image:
  repository: terraform-ai-agent
  pullPolicy: IfNotPresent
  tag: "k8s-local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

operator:
  enabled: true
  logLevel: INFO
  defaultEngine: opentofu
  reconcileIntervalSec: 30
  driftCheckEnabled: true
  gitopsProvider: argocd

dashboard:
  enabled: true
  replicaCount: 1
  image: terraform-ai-agent:k8s-local
  pullPolicy: IfNotPresent
  secretKey: "k8s-secret-key-terraform-ai-agent"
  service:
    type: LoadBalancer
    port: 5000

admin:
  username: "admin"
  password: "StrongPassword123!"
  email: "admin@platform.io"

env:
  defaultModel: "gemini/gemini-2.0-flash"
  testLocal: "true"

secrets:
  enabled: true
  name: "terraform-ai-secrets"

redis:
  enabled: true
  image: redis:7-alpine
  pullPolicy: IfNotPresent
  port: 6379

database:
  enabled: true
  image: postgres:15-alpine
  pullPolicy: IfNotPresent
  port: 5432
  name: terraform_agent
  user: terra_user
  password: terra_password

serviceAccount:
  create: true
  annotations: {}
  name: "terraform-ai-operator"

rbac:
  create: true

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext: {}

securityContext: {}

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 150m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

monitoring:
  enabled: true
  prometheus:
    port: 9090
  grafana:
    port: 3000


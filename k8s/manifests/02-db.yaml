apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-ai-db
  namespace: terraform-ai-system
  labels:
    app.kubernetes.io/name: terraform-ai-db
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terraform-ai-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terraform-ai-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "terra_user"
            - name: POSTGRES_PASSWORD
              value: "terra_password"
            - name: POSTGRES_DB
              value: "terraform_agent"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terraform-ai-db
  namespace: terraform-ai-system
  labels:
    app.kubernetes.io/name: terraform-ai-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: terraform-ai-db

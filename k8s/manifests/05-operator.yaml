apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-ai-operator
  namespace: terraform-ai-system
  labels:
    app.kubernetes.io/name: terraform-ai-operator
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terraform-ai-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terraform-ai-operator
    spec:
      serviceAccountName: terraform-ai-operator
      containers:
        - name: operator
          image: terraform-ai-agent:k8s-local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - k8s.operator.reconciler
          envFrom:
            - secretRef:
                name: terraform-ai-secrets
                optional: true
          env:
            - name: OPERATOR_LOG_LEVEL
              value: "INFO"
            - name: DEFAULT_ENGINE
              value: "opentofu"
            - name: RECONCILE_INTERVAL_SEC
              value: "30"
            - name: DRIFT_CHECK_ENABLED
              value: "true"
            - name: DEFAULT_MODEL
              value: "gemini/gemini-2.0-flash"
            - name: TEST_LOCAL
              value: "true"
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/k8s/operator/status
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/k8s/operator/status
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi

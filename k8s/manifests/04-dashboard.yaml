apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-ai-dashboard
  namespace: terraform-ai-system
  labels:
    app.kubernetes.io/name: terraform-ai-dashboard
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: terraform-ai-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terraform-ai-dashboard
    spec:
      serviceAccountName: terraform-ai-operator
      containers:
        - name: dashboard
          image: terraform-ai-agent:k8s-local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - app/dashboard.py
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - secretRef:
                name: terraform-ai-secrets
                optional: true
          env:
            - name: DATABASE_URL
              value: "postgresql://terra_user:terra_password@terraform-ai-db:5432/terraform_agent"
            - name: REDIS_URL
              value: "redis://terraform-ai-redis:6379/0"
            - name: PYTHONPATH
              value: "/app"
            - name: RUNNING_IN_DOCKER
              value: "true"
            - name: CREWAI_DISABLE_TELEMETRY
              value: "true"
            - name: OTEL_SDK_DISABLED
              value: "true"
            - name: FLASK_SECRET_KEY
              value: "supersecretk8skey123"
            - name: DEFAULT_ADMIN_USER
              value: "admin"
            - name: DEFAULT_ADMIN_PASSWORD
              value: "StrongPassword123!"
            - name: DEFAULT_ADMIN_EMAIL
              value: "admin@platform.io"
            - name: DEFAULT_MODEL
              value: "gemini/gemini-2.0-flash"
            - name: TEST_LOCAL
              value: "true"
          livenessProbe:
            httpGet:
              path: /api/k8s/operator/status
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/k8s/operator/status
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: terraform-ai-dashboard
  namespace: terraform-ai-system
  labels:
    app.kubernetes.io/name: terraform-ai-dashboard
spec:
  type: LoadBalancer
  ports:
    - port: 5000
      targetPort: 5000
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: terraform-ai-dashboard

apiVersion: v1
kind: ServiceAccount
metadata:
  name: terraform-ai-operator
  namespace: terraform-ai-system
  labels:
    app.kubernetes.io/name: terraform-ai-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: terraform-ai-operator-role
  labels:
    app.kubernetes.io/name: terraform-ai-operator
rules:
  # CRD access
  - apiGroups:
      - platform.terraform-ai.io
    resources:
      - terraformagents
      - terraformagents/status
      - platformprojects
      - platformprojects/status
      - workflows
      - workflows/status
      - policies
      - policies/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Core K8s resources for pods, logs, events, services, nodes, and secrets
  - apiGroups:
      - ""
    resources:
      - events
      - pods
      - pods/log
      - services
      - nodes
      - configmaps
      - secrets
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
  - apiGroups:
      - "apps"
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: terraform-ai-operator-binding
  labels:
    app.kubernetes.io/name: terraform-ai-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: terraform-ai-operator-role
subjects:
  - kind: ServiceAccount
    name: terraform-ai-operator
    namespace: terraform-ai-system
